<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional message 3</title><link rel="stylesheet" href="sample.css"></head><body><header class="bar"><strong>Messages</strong><small>Inbox</small></header><div class="layout"><nav class="nav"><div class="active">Inbox</div><div>Sent</div><div>Drafts</div></nav><main class="message"><h1>Unknown number</h1><div class="meta">From <span data-personal="phone">202-555-0186</span></div><div class="bubble">Mom, it’s me, <span data-personal="name">Alex Sample</span>. My phone broke. This is my new number.<div class="time">10:42</div></div><div class="bubble">Can you buy two $100 gift cards for me? Send me the codes when you get them.<div class="time">10:43</div></div></main></div><footer></footer></body></html>
